name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy website
        run: |
          ssh -o StrictHostKeyChecking=no peterbulloch@192.168.0.22 '
            cd ~/peterbulloch.dev &&
            git pull origin main &&
            rsync -av --delete --exclude=".git" ./ /var/lib/nginx/html/
          '